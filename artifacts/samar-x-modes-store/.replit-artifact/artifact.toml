kind = "web"
previewPath = "/"
title = "Samar X Modes Store"
description = "A mobile-first digital panel storefront with UPI checkout, payment-proof upload, WhatsApp delivery handoff, and a Firebase-synced admin dashboard."
version = "1.0.0"
id = "artifacts/samar-x-modes-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23603

[services.development]
run = "pnpm --filter @workspace/samar-x-modes-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/samar-x-modes-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/samar-x-modes-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23603"
BASE_PATH = "/"
